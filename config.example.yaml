# Copy this file to config.yaml (gitignored) and fill in your provider
# API key, or skip the file entirely and configure Locker purely through
# environment variables — see internal/config/config.go for the full list.

listen_addr: ":8080"
request_timeout: 60s

# Closes a streaming upstream response if no bytes arrive for this long,
# so a stalled provider can't hold a connection open forever. 0 disables
# this watchdog. See Docs/roadmap.md Phase 5.3.
stream_idle_timeout: 90s

# Which entry under `providers` below handles requests. One of "openai",
# "anthropic", "mistral". Locker always exposes the same OpenAI-compatible
# API to clients regardless of which one is active — for Anthropic,
# requests/responses are translated to/from its native Messages API
# shape (internal/providers/anthropic.go); Mistral's API is already
# OpenAI-shaped, so it needs no translation.
provider: openai

providers:
  openai:
    # Reads from the OPENAI_API_KEY environment variable at load time.
    # Never commit a real key here.
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"

  # anthropic:
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   base_url: "https://api.anthropic.com"

  # mistral:
  #   api_key: "${MISTRAL_API_KEY}"
  #   base_url: "https://api.mistral.ai/v1"

# If set, only these models may be requested through Locker; any other
# model is rejected with 403 before the request reaches the provider.
# Leave empty to allow any model.
allowed_models: []

# PII detection/masking (internal/pii), applied to every request before
# it reaches the provider and restored in every response, streaming
# included. On by default.
pii:
  disabled: false

  # Restrict to a subset of built-in rules: email, phone, iban,
  # credit_card, siren, siret. Leave empty to enable all of them.
  enabled_rules: []

  # Custom RegEx rules, added on top of the built-ins. No validation
  # formula is applied — shape match is enough.
  custom_rules: []
  #  - name: employee_id
  #    pattern: 'EMP-\d{6}'
  #    placeholder: EMPLOYEE_ID

  # Layer 2: local NER (internal/pii/ner), catches unstructured PII
  # RegEx can't — person names, organizations, locations, dates. A
  # deterministic gazetteer/heuristic engine, not a statistical model;
  # see the package doc comment. On by default.
  ner:
    disabled: false

  # Bounds how many trailing bytes of a streamed response are held back
  # to avoid emitting a split placeholder token — a latency/accuracy
  # tradeoff. 0 uses the built-in default (64 bytes). See Docs/roadmap.md
  # Phase 5.1.
  stream_lookback_bytes: 0
