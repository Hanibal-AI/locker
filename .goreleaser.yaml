# goreleaser config — Docs/roadmap.md Phase 7.1. Cross-compiles the
# `locker` binary, builds multi-arch Docker images published to GHCR,
# and creates a GitHub Release with binaries + changelog attached.
# Triggered by .github/workflows/release.yml on a `v*` tag push.
#
# Local dry run (no publishing): goreleaser release --snapshot --clean
version: 2

project_name: locker

before:
  hooks:
    - go mod tidy

builds:
  - id: locker
    main: ./cmd/locker
    binary: locker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: locker-archive
    ids: [locker]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - config.example.yaml

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

dockers:
  - id: locker-amd64
    ids: [locker]
    goos: linux
    goarch: amd64
    dockerfile: .goreleaser/Dockerfile
    image_templates:
      - "ghcr.io/hanibal-ai/locker:{{ .Version }}-amd64"
      - "ghcr.io/hanibal-ai/locker:latest-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/Hanibal-AI/locker"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: locker-arm64
    ids: [locker]
    goos: linux
    goarch: arm64
    dockerfile: .goreleaser/Dockerfile
    image_templates:
      - "ghcr.io/hanibal-ai/locker:{{ .Version }}-arm64"
      - "ghcr.io/hanibal-ai/locker:latest-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/Hanibal-AI/locker"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/hanibal-ai/locker:{{ .Version }}"
    image_templates:
      - "ghcr.io/hanibal-ai/locker:{{ .Version }}-amd64"
      - "ghcr.io/hanibal-ai/locker:{{ .Version }}-arm64"
  - name_template: "ghcr.io/hanibal-ai/locker:latest"
    image_templates:
      - "ghcr.io/hanibal-ai/locker:latest-amd64"
      - "ghcr.io/hanibal-ai/locker:latest-arm64"

release:
  github:
    owner: Hanibal-AI
    name: locker
  draft: false
  prerelease: auto
